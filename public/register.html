<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VISIONARICE | Register</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <link
        rel="stylesheet"
        href="/css/auth-email.css?v=20260911-1"
    >
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <h1>VISIONARICE</h1>

            <p>
                Rice Disease Detection and Monitoring System
            </p>
        </div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Register to access VISIONARICE
        </p>

        <div id="message"></div>

        <form id="registerForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="first_name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last_name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        autocomplete="family-name"
                        required
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="middle_name">
                        Middle Name
                    </label>

                    <input
                        type="text"
                        id="middle_name"
                    >
                </div>

                <div class="form-group">
                    <label for="suffix">
                        Suffix
                    </label>

                    <select id="suffix">
                        <option value="">None</option>
                        <option value="Jr.">Jr.</option>
                        <option value="Sr.">Sr.</option>
                        <option value="II">II</option>
                        <option value="III">III</option>
                        <option value="IV">IV</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label for="phone_number">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone_number"
                    placeholder="09XXXXXXXXX"
                    autocomplete="tel"
                >
            </div>

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <small>
                    Minimum of 8 characters
                </small>
            </div>

            <button
                type="submit"
                class="primary-btn"
            >
                Register
            </button>

        </form>

        <p class="email-confirmation-note">
            After registration, we will send a verification
            link to your email. You must verify your email
            before signing in.
        </p>

        <p class="switch-text">
            Already have an account?
            <a href="/login.html">
                Sign In
            </a>
        </p>

    </div>

</div>

<script src="/js/register.js?v=20260911-1"></script>

</body>
</html>
