<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VISIONARICE | Register</title>

    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <h1>VISIONARICE</h1>
            <p>Rice Disease Detection and Monitoring System</p>
        </div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Register to access VISIONARICE
        </p>

        <div id="message"></div>

        <form id="registerForm">

            <div class="form-row">

                <div class="form-group">
                    <label>First Name</label>

                    <input
                        type="text"
                        id="first_name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Last Name</label>

                    <input
                        type="text"
                        id="last_name"
                        required
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Middle Name</label>

                    <input
                        type="text"
                        id="middle_name"
                    >
                </div>

                <div class="form-group">
                    <label>Suffix</label>

                    <select id="suffix">
                        <option value="">None</option>
                        <option value="Jr.">Jr.</option>
                        <option value="Sr.">Sr.</option>
                        <option value="II">II</option>
                        <option value="III">III</option>
                        <option value="IV">IV</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Phone Number</label>

                <input
                    type="text"
                    id="phone_number"
                    placeholder="09XXXXXXXXX"
                >
            </div>

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    minlength="8"
                    required
                >

                <small>
                    Minimum of 8 characters
                </small>
            </div>

            <button type="submit" class="primary-btn">
                Register
            </button>

        </form>

        <p class="switch-text">
            Already have an account?
            <a href="/login.html">Sign In</a>
        </p>

    </div>

</div>

<script src="/js/register.js"></script>

</body>
</html>
