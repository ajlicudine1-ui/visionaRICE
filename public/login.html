<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VISIONARICE | Login</title>

    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <h1>VISIONARICE</h1>
            <p>Rice Disease Detection and Monitoring System</p>
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account</p>

        <div id="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="primary-btn">
                Sign In
            </button>

        </form>

        <p class="switch-text">
            Don't have an account?
            <a href="/register.html">Register</a>
        </p>

    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
