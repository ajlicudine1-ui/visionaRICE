<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VISIONARICE | Login</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <link
        rel="stylesheet"
        href="/css/auth-email.css?v=20260911-4"
    >
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <h1>VISIONARICE</h1>

            <p>
                Rice Disease Detection and Monitoring System
            </p>
        </div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Sign in to your account
        </p>

        <div id="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <div class="auth-password-field">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="auth-password-toggle"
                        data-password-target="password"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
<svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"></path>
    <circle cx="12" cy="12" r="2.8"></circle>
</svg>
<svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 3l18 18"></path>
    <path d="M10.6 10.7a2.3 2.3 0 0 0 3.2 3.2"></path>
    <path d="M9.2 5.3A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16.2 16.2 0 0 1-2.6 3.4"></path>
    <path d="M6.1 6.1C3.7 7.8 2.5 12 2.5 12s3.5 7 9.5 7a9.8 9.8 0 0 0 4.1-.9"></path>
</svg>
</button>
                </div>
            </div>

            <div class="login-help-row">
                <button
                    id="forgotPasswordLink"
                    type="button"
                    class="auth-text-link"
                >
                    Forgot Password?
                </button>
            </div>

            <button
                type="submit"
                class="primary-btn"
            >
                Sign In
            </button>

        </form>

        <div
            id="resendVerificationWrap"
            class="resend-verification hidden"
        >
            <span>
                Didn't receive the verification email?
            </span>

            <button
                id="resendVerificationButton"
                type="button"
                class="auth-text-link"
            >
                Resend Verification Email
            </button>
        </div>

        <p class="switch-text">
            Don't have an account?
            <a href="/register.html">
                Register
            </a>
        </p>

    </div>

</div>


<!-- Forgot Password Modal -->
<div
    id="forgotPasswordModal"
    class="auth-modal hidden"
    aria-hidden="true"
>
    <div
        class="auth-modal-backdrop"
        data-close-auth-modal
    ></div>

    <section
        class="auth-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="forgotPasswordTitle"
    >
        <button
            type="button"
            class="auth-modal-close"
            data-close-auth-modal
            aria-label="Close"
        >
            ×
        </button>

        <div class="auth-modal-icon">
            🔑
        </div>

        <h2 id="forgotPasswordTitle">
            Forgot Password?
        </h2>

        <p>
            Enter your registered email address.
            We will send you a secure password reset link.
        </p>

        <form id="forgotPasswordForm">

            <div class="form-group">
                <label for="forgotEmail">
                    Email Address
                </label>

                <input
                    id="forgotEmail"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>

            <button
                id="sendResetButton"
                type="submit"
                class="primary-btn"
            >
                Send Reset Link
            </button>

        </form>

        <div
            id="forgotMessage"
            class="modal-message"
        ></div>
    </section>
</div>


<script src="/js/login.js?v=20260911-4"></script>

</body>
</html>
