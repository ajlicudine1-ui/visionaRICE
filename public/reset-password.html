<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VISIONARICE | Reset Password</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <link
        rel="stylesheet"
        href="/css/auth-email.css?v=20260911-4"
    >
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <h1>VISIONARICE</h1>

            <p>
                Rice Disease Detection and Monitoring System
            </p>
        </div>

        <h2>Reset Password</h2>

        <p class="subtitle">
            Create a new password for your account.
        </p>

        <div id="message"></div>

        <form id="resetPasswordForm">

            <div class="form-group">
                <label for="newPassword">
                    New Password
                </label>

                <div class="auth-password-field">
                    <input
                        id="newPassword"
                        type="password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="auth-password-toggle"
                        data-password-target="newPassword"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
<svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"></path>
    <circle cx="12" cy="12" r="2.8"></circle>
</svg>
<svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 3l18 18"></path>
    <path d="M10.6 10.7a2.3 2.3 0 0 0 3.2 3.2"></path>
    <path d="M9.2 5.3A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16.2 16.2 0 0 1-2.6 3.4"></path>
    <path d="M6.1 6.1C3.7 7.8 2.5 12 2.5 12s3.5 7 9.5 7a9.8 9.8 0 0 0 4.1-.9"></path>
</svg>
</button>
                </div>

                <small>
                    Minimum of 8 characters
                </small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="auth-password-field">
                    <input
                        id="confirmPassword"
                        type="password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="auth-password-toggle"
                        data-password-target="confirmPassword"
                        aria-label="Show confirm password"
                        aria-pressed="false"
                    >
<svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"></path>
    <circle cx="12" cy="12" r="2.8"></circle>
</svg>
<svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 3l18 18"></path>
    <path d="M10.6 10.7a2.3 2.3 0 0 0 3.2 3.2"></path>
    <path d="M9.2 5.3A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16.2 16.2 0 0 1-2.6 3.4"></path>
    <path d="M6.1 6.1C3.7 7.8 2.5 12 2.5 12s3.5 7 9.5 7a9.8 9.8 0 0 0 4.1-.9"></path>
</svg>
</button>
                </div>
            </div>

            <button
                type="submit"
                class="primary-btn"
            >
                Reset Password
            </button>

        </form>

        <p class="switch-text">
            <a href="/login.html">
                Back to Sign In
            </a>
        </p>

    </div>

</div>

<script src="/js/reset-password.js?v=20260911-4"></script>

</body>
</html>
