<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VISIONARICE | Reset Password</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <link
        rel="stylesheet"
        href="/css/auth-email.css?v=20260911-1"
    >
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <h1>VISIONARICE</h1>

            <p>
                Rice Disease Detection and Monitoring System
            </p>
        </div>

        <h2>Reset Password</h2>

        <p class="subtitle">
            Create a new password for your account.
        </p>

        <div id="message"></div>

        <form id="resetPasswordForm">

            <div class="form-group">
                <label for="newPassword">
                    New Password
                </label>

                <input
                    id="newPassword"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="primary-btn"
            >
                Reset Password
            </button>

        </form>

        <p class="switch-text">
            <a href="/login.html">
                Back to Sign In
            </a>
        </p>

    </div>

</div>

<script src="/js/reset-password.js?v=20260911-1"></script>

</body>
</html>
