<section id="notifications" class="content-section" style="display:none;">

<style>
html {
    scroll-padding-top: 90px;
}

/* =========================================================
   NOTIFICATIONS PAGE
   ========================================================= */

#notifications {
    scroll-margin-top: 90px;

    width: 100%;
    min-height: calc(100vh - 90px);

    margin: 0 !important;
    padding: 25px 24px 50px !important;

    box-sizing: border-box;

    background: #f7f4ea;
}


/* =========================================================
   MAIN NOTIFICATIONS CARD
   ========================================================= */

#notifications .notifications-card {
    width: 100%;
    max-width: 1100px;

    margin: 5px auto 0;

    padding: 30px;

    box-sizing: border-box;

    background: #ffffff;

    border: 1px solid #e5e9e2;
    border-radius: 24px;

    box-shadow:
        0 8px 30px rgba(23, 63, 50, 0.08);
}


/* Remove Tailwind ml / padding effects */
#notifications main {
    margin: 0 !important;
    margin-left: 0 !important;

    padding: 0 !important;

    width: 100% !important;
    max-width: 100% !important;
}


/* =========================================================
   TITLE
   ========================================================= */

#notifications h1 {
    margin: 0 0 24px 0 !important;
    padding: 0 !important;

    font-size: 1.5rem !important;
    font-weight: 800;

    line-height: 1.2;

    color: #173f32;
}


/* =========================================================
   FILTER AREA
   ========================================================= */

#notifications main > div.mb-6 {
    margin: 0 0 22px 0 !important;
    padding: 0 !important;

    display: flex;
    align-items: center;

    gap: 8px;
    flex-wrap: wrap;
}


/* Filter buttons */
#notifications .filter-btn {
    padding: 10px 18px;

    border: 1px solid #e0e5de;
    border-radius: 12px;

    background: #eef2ec;

    color: #374151;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


#notifications .filter-btn:hover {
    background: #e1e9df;

    transform: translateY(-1px);
}


#notifications .filter-btn.active {
    background: #16a34a;
    color: #ffffff;

    border-color: #16a34a;

    box-shadow:
        0 5px 14px rgba(22, 163, 74, 0.20);
}


/* =========================================================
   NOTIFICATION LIST
   ========================================================= */

#notif-container {
    width: 100%;

    margin: 0 !important;
    padding: 0 !important;

    box-sizing: border-box;
}


/* Individual notification */
#notifications .notification-item {
    width: 100%;

    margin: 0 0 12px 0 !important;
    padding: 0 !important;

    background: #ffffff;

    border: 1px solid #e8ece6;
    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.05);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
}


#notifications .notification-item:hover {
    transform: translateY(-2px);

    border-color: #d7e0d4;

    box-shadow:
        0 9px 24px rgba(23, 63, 50, 0.09);
}


/* Notification content */
#notifications .notification-card {
    width: 100%;

    margin: 0 !important;

    padding: 18px 20px !important;

    box-sizing: border-box;

    background: #ffffff;

    border-radius: 14px;
}


/* Remove paragraph default margins */
#notifications .notification-card p {
    margin: 0 !important;
}


/* Notification message */
#notifications .notification-card p:first-child {
    margin-bottom: 8px !important;

    color: #203126;
}


/* Date */
#notifications .notification-card .text-sm {
    margin-top: 5px !important;

    color: #778078;
}


/* =========================================================
   EMPTY / LOADING MESSAGE
   ========================================================= */

#notif-container > p {
    margin: 0;

    padding: 22px;

    text-align: center;

    background: #f8faf7;

    border: 1px dashed #d8dfd5;
    border-radius: 12px;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 768px) {

    #notifications {
        padding: 18px 14px 35px !important;
    }


    #notifications .notifications-card {
        padding: 20px;

        border-radius: 20px;
    }


    #notifications main {
        margin: 0 !important;
        padding: 0 !important;
    }


    #notifications h1 {
        font-size: 1.4rem !important;

        margin-bottom: 18px !important;
    }


    #notifications main > div.mb-6 {
        gap: 7px;

        margin-bottom: 18px !important;
    }


    #notifications .filter-btn {
        padding: 9px 14px;

        font-size: 13px;
    }


    #notifications .notification-card {
        padding: 15px !important;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 480px) {

    #notifications {
        padding: 12px 10px 28px !important;
    }


    #notifications .notifications-card {
        padding: 16px;

        border-radius: 16px;
    }


    #notifications h1 {
        font-size: 1.3rem !important;

        margin-bottom: 16px !important;
    }


    #notifications main > div.mb-6 {
        gap: 6px;
    }


    #notifications .filter-btn {
        flex: 1;

        min-width: 70px;

        padding: 8px 10px;

        font-size: 12px;

        text-align: center;
    }


    #notifications .notification-card {
        padding: 14px !important;
    }

}

</style>


<!-- ======================================================
     OUTER NOTIFICATIONS CARD
     ====================================================== -->

<div class="notifications-card">

    <main>

        <h1 class="text-2xl font-bold text-green-800 mb-6">
            📢 Notifications
        </h1>


        <!-- ==============================================
             FILTER BUTTONS
             ============================================== -->

        <div class="mb-6 flex gap-3 flex-wrap">

            <button
                onclick="event.preventDefault(); loadNotificationsWithFilter('all')"
                id="filter-all"
                class="filter-btn active"
            >
                All
            </button>


            <button
                onclick="event.preventDefault(); loadNotificationsWithFilter('daily')"
                id="filter-daily"
                class="filter-btn"
            >
                📅 Daily
            </button>


            <button
                onclick="event.preventDefault(); loadNotificationsWithFilter('weekly')"
                id="filter-weekly"
                class="filter-btn"
            >
                📆 Weekly
            </button>


            <button
                onclick="event.preventDefault(); loadNotificationsWithFilter('monthly')"
                id="filter-monthly"
                class="filter-btn"
            >
                📊 Monthly
            </button>

        </div>


        <!-- ==============================================
             NOTIFICATIONS
             ============================================== -->

        <div
            id="notif-container"
            class="text-gray-500"
        >
            Loading...
        </div>

    </main>

</div>


<script>

let currentFilter = 'all';


/* =========================================================
   FILTER NOTIFICATIONS
   ========================================================= */

async function loadNotificationsWithFilter(filter) {

    currentFilter = filter;

    await loadNotifications(filter);


    /* Update active button */
    document
        .querySelectorAll('#notifications .filter-btn')
        .forEach(btn => {

            btn.classList.remove('active');

        });


    const activeButton =
        document.getElementById(
            'filter-' + filter
        );


    if (activeButton) {

        activeButton.classList.add(
            'active'
        );

    }

}



/* =========================================================
   LOAD NOTIFICATIONS
   ========================================================= */

async function loadNotifications(filter = 'all') {

    const notifContainer =
        document.getElementById(
            "notif-container"
        );


    if (!notifContainer) {
        return;
    }


    notifContainer.innerHTML =
        "Loading...";


    try {

        const url =
            filter === 'all'

                ? "/rice_disease/notifications/json/"

                : `/rice_disease/notifications/json/?filter=${filter}`;


        const response =
            await fetch(url);


        const data =
            await response.json();



        /* =================================================
           NO NOTIFICATIONS
           ================================================= */

        if (
            !data.notifications ||
            data.notifications.length === 0
        ) {

            notifContainer.innerHTML = `
                <p class="text-gray-500">
                    No notifications found for the selected filter.
                </p>
            `;

            return;

        }



        /* =================================================
           BUILD NOTIFICATION CARDS
           ================================================= */

        notifContainer.innerHTML =
            data.notifications
                .map(n => {


                    /* Convert ISO time to Philippine time */

                    const dateObj =
                        new Date(
                            n.created_at
                        );


                    const formattedDate =
                        dateObj
                            .toLocaleString(
                                "en-US",
                                {

                                    month: "short",

                                    day: "numeric",

                                    year: "numeric",

                                    hour: "numeric",

                                    minute: "2-digit",

                                    hour12: true,

                                    timeZone:
                                        "Asia/Manila"

                                }
                            )
                            .replace(
                                ",",
                                " —"
                            );


                    return `
                        <div class="notification-item">

                            <div class="notification-card">

                                <p class="text-gray-800 font-medium">
                                    ${n.message}
                                </p>

                                <p class="text-sm text-gray-500 mt-1">
                                    Created: ${formattedDate}
                                </p>

                            </div>

                        </div>
                    `;

                })
                .join("");



    } catch (error) {

        console.error(
            "Error loading notifications:",
            error
        );


        notifContainer.innerHTML = `
            <p class="text-red-500">
                ⚠️ Error loading notifications.
            </p>
        `;

    }

}



/* =========================================================
   INITIAL LOAD
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadNotifications(
            currentFilter
        );

    }
);

</script>

</section>
