<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Reset Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e8f5e8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .reset-container {
      background: #fff;
      padding: 50px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h2 {
      margin-bottom: 25px;
      color: #333;
      font-size: 28px;
    }

    input[type="password"] {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 16px;
    }

    input[type="password"]:focus {
      border-color: #4A90E2;
    }

    button {
      width: 100%;
      background: #079331;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s;
    }

    button:hover {
      background: #357ABD;
    }

    .error {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

    .success {
      color: green;
      margin-top: 10px;
      font-size: 14px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      html { zoom: 1.1; }
      .reset-container {
        width: 100%;
        padding: 50px;
        margin: 5vh auto;
      }

      h2 {
        font-size: 26px;
      }

      input[type="password"] {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <h2>Set New Password</h2>
    <form method="POST" onsubmit="return validatePasswords()">
      {% csrf_token %}
      <input type="password" id="password1" name="password" placeholder="Enter new password" required>
      <input type="password" id="password2" name="confirm_password" placeholder="Confirm new password" required>
      <button type="submit">Reset Password</button>
      <p id="error-msg" class="error"></p>
    </form>
  </div>

  <script>
    function validatePasswords() {
      const p1 = document.getElementById("password1").value;
      const p2 = document.getElementById("password2").value;
      const errorMsg = document.getElementById("error-msg");

      if (p1 !== p2) {
        errorMsg.textContent = "Passwords do not match!";
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
