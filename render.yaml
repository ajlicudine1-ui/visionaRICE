services:
  - type: web
    name: disease-detection
    env: python
    plan: free  # free plan has limited memory
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: python manage.py showmigrations && python manage.py migrate && gunicorn disease_detection_project.wsgi:application --bind 0.0.0.0:$PORT --timeout 600 --workers 1

    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.10.18
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: disease-detection.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: disease-db
          property: connectionString
      - key: EMAIL_HOST_USER
        value: janvicmadayag03@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false  # Set manually in Render dashboard for security

databases:
  - name: disease-db
    plan: free
